apiVersion: v1
kind: Namespace
metadata:
  name: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
automountServiceAccountToken: false
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openclaw-enterprise-nitro-adapter-selfsigned
  namespace: openclaw-enterprise-adapter
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openclaw-enterprise-nitro-adapter-serving
  namespace: openclaw-enterprise-adapter
spec:
  secretName: openclaw-enterprise-nitro-adapter-tls
  dnsNames:
    - openclaw-enterprise-nitro-adapter.openclaw-enterprise-adapter.svc
    - openclaw-enterprise-nitro-adapter.openclaw-enterprise-adapter.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: openclaw-enterprise-nitro-adapter-selfsigned
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
    spec:
      serviceAccountName: openclaw-enterprise-nitro-adapter
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          # Build adapter/Dockerfile and publish this versioned image to your registry.
          image: openclaw-enterprise-nitro-adapter:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: openclaw-enterprise-nitro-adapter-tls
            defaultMode: 288
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-enterprise-nitro-adapter
  namespace: openclaw-enterprise-adapter
  labels:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-enterprise-nitro-adapter
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: openclaw-enterprise-nitro-adapter
  annotations:
    cert-manager.io/inject-ca-from: openclaw-enterprise-adapter/openclaw-enterprise-nitro-adapter-serving
webhooks:
  - name: nitro-adapter.openclaw-enterprise.sandbox.eks.amazonaws.com
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: openclaw-enterprise-adapter
        name: openclaw-enterprise-nitro-adapter
        path: /mutate
        port: 443
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: openclaw-enterprise
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
        scope: Namespaced
